services:
  postgres:
    image: postgres
    container_name: files-manager-postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/postgresql:/var/lib/postgresql/data
    ports:
      - ${POSTGRES_PORT}:5432

  redis:
    image: redis:alpine
    container_name: files-manager-redis
    env_file:
      - .env
    restart: always
    ports:
      - ${REDIS_PORT}:6379

volumes:
  data:
    driver: local
